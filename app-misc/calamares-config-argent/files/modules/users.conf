---
userGroup:       users
defaultGroups:
    - lp
    - lpadmin
    - video
    - tape
    - uucp
    - wheel
    - audio
    - cdrom
    - cdrw
    - kvm
    - usb
    - plugdev
    - vboxguest
    - vboxsf
sudoersGroup: wheel
autologinGroup: autologin
doAutologin: false
setRootPassword: true
doReusePassword: true
passwordRequirements:
    nonempty: true
    minLength: 8
    libpwquality:
        - minlen=8
        - minclass=2
allowWeakPasswords: true
allowWeakPasswordsDefault: true
user:
  shell: /bin/bash
  forbidden_names: [ root ]
  home_permissions: "o700"

hostname:
  location: EtcFile
  writeHostsFile: true