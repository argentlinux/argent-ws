---
# Argent Linux post-installation configuration
# Commands to run in the target system after user creation
# Tuning GPU drivers technique before booting script borrowed from CatchyOS, code adapted by Argent

commands:
    - "systemctl enable systemd-timesyncd.service"
    - "systemctl enable bluetooth.service"
    - "systemctl --global enable pipewire.socket pipewire-pulse.socket wireplumber.service"
    - ["sh", "-c", "if [ -f /usr/share/sddm/themes/argent-modern/metadata.desktop ]; then mkdir -p /etc/sddm.conf.d && printf '[Theme]\\nCurrent=argent-modern\\n' > /etc/sddm.conf.d/10-argent-modern.conf; fi; exit 0"]
    - ["sh", "-c", "if ls -d /sys/class/drm/card[0-9]* > /dev/null 2>&1; then mkdir -p /etc/sddm.conf.d && printf '[General]\\nDisplayServer=wayland\\nGreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell\\n\\n[Wayland]\\nCompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1\\n' > /etc/sddm.conf.d/10-argent-wayland.conf; fi; exit 0"]
    - "rm -f /etc/systemd/system/multi-user.target.wants/argentlive.service"
    - "systemctl disable argent-config-vbox.service"
    - ["sh", "-c", "if [ \"$(systemd-detect-virt 2>/dev/null)\" = oracle ] || grep -qi innotek /sys/class/dmi/id/sys_vendor 2>/dev/null; then exit 0; fi; CLEAN_DELAY=0 emerge --unmerge -q app-emulation/virtualbox-guest-additions app-emulation/virtualbox-guest-modules; exit 0"]
    - ["sh", "-c", "turing=; legacy=; for d in /sys/bus/pci/devices/*; do [ \"$(cat $d/vendor)\" = 0x10de ] || continue; case \"$(cat $d/class)\" in 0x03*) ;; *) continue ;; esac; if [ $(( $(cat $d/device) )) -ge $((0x1e00)) ]; then turing=1; else legacy=1; fi; done; mkdir -p /etc/dracut.conf.d; if [ -n \"$turing\" ]; then echo 'force_drivers+=\" nvidia nvidia_modeset nvidia_uvm nvidia_drm \"' > /etc/dracut.conf.d/20-argent-nvidia.conf; elif [ -n \"$legacy\" ]; then echo 'force_drivers+=\" nouveau \"' > /etc/dracut.conf.d/20-argent-nvidia.conf; fi; exit 0"]